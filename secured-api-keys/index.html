<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />

    <link rel="stylesheet" href="./src/app.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/instantsearch.css@7.1.0/themes/algolia.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/instantsearch.css@7.1.0/themes/algolia.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/selectize@0.12.6/dist/css/selectize.css"
    />

    <title>Secured API Keys demo</title>
  </head>

  <body>
    <div class="ais-InstantSearch">
      <h1>GOODFOOD</h1>
      <p>
        <a href="/">Search</a>
      </p>
      <div id="searchbox"></div>

      <div id="current-refinements"></div>

      <div class="left-panel">
        <div id="categories"></div>
        <div id="allergens"></div>
        <div id="price"></div>
        <div id="stats"></div>
      </div>

      <div class="right-panel">
        <div id="qrcd"></div>
        <div id="hits"></div>
        <div id="pagination"></div>
      </div>
    </div>

    <script>
      window.SERVER_DATA = __SERVER_DATA__;
      window.USER = __USER__;
      window.INDEX = "__INDEX__";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.3.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/selectize@0.12.6/dist/js/standalone/selectize.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/algoliasearch@4/dist/algoliasearch-lite.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/instantsearch.js@4"></script>
    <script src="./src/app.js"></script>
  </body>
</html>
