      always prefer -lite version on standard search implementation
    -->

      crossorigin="anonymous"
    ></script>
    <script

    </header>

      <h1 id="title"></h1>
      <div id="customCurrentRefinements"></div>
      <div id="currentRefinements"></div>
      <div id="results">
        <div id="refinements">
          <div id="genres"></div>
          <div id="actors"></div>
          <div id="directors"></div>
          <div id="onsale"></div>
        </div>
        <div id="hits"></div>
        <div id="noresults" style="display: none"></div>
      </div>
    </div>
    <div id="product"></div>
    <div id="relatedProducts"></div>
    <script src="src/autocomplete.js"></script>
    <script src="src/app.js"></script>
